name: Renovate
on:
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
# Scheduled runs are frequently delayed past the cron tick, by up to ~50
# minutes historically, so the 3 hour interval alone does not keep runs from
# overlapping. Queue them instead of cancelling; a cancelled run leaves
# branches half-updated.
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: ubuntu-latest
    # Backstop for a wedged post-upgrade command. executionTimeout in
    # .github/renovate-global.json bounds a single command; nothing bounds
    # their sum, so this bounds the run.
    timeout-minutes: 150
    steps:
      - name: Get token
        id: get_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          private_key: ${{ secrets.PRIVATE_KEY }}
          app_id: ${{ secrets.APP_ID }}
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@957af03d760b2c87fc65cb95628f6d5f95d9c578 # v46.0.0
        with:
          configurationFile: .github/renovate-global.json
          token: '${{ steps.get_token.outputs.token }}'
          renovate-image: ghcr.io/cgrindel/renovate-bot
          renovate-version: latest
        env:
          LOG_LEVEL: debug
          # Gives do_renovate_post_upgrade in rules_swift_package_manager the
          # BuildBuddy key, so its per-workspace Bazel invocations read from the
          # remote cache instead of rebuilding the Go toolchain in each of the
          # 34 workspaces.
          #
          # Must travel under this name, not as a bare BUILDBUDDY_API_KEY.
          # renovatebot/github-action forwards only RENOVATE_*, LOG_LEVEL,
          # GITHUB_COM_TOKEN, NODE_OPTIONS, and the proxy vars into the
          # container; Renovate then strips anything not on its own allowlist
          # before running a post-upgrade command. RENOVATE_CUSTOM_ENV_VARIABLES
          # clears both hops.
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"BUILDBUDDY_API_KEY":"${{ secrets.BUILDBUDDY_API_KEY }}"}'
