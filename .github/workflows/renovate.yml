name: Renovate
on:
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
# Scheduled runs are frequently delayed past the cron tick, by up to ~50
# minutes historically, so the 3 hour interval alone does not keep runs from
# overlapping. Queue them instead of cancelling; a cancelled run leaves
# branches half-updated.
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: ubuntu-latest
    # Backstop for a wedged post-upgrade command. executionTimeout in
    # .github/renovate-global.json bounds a single command; nothing bounds
    # their sum, so this bounds the run.
    timeout-minutes: 150
    steps:
      - name: Get token
        id: get_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          private_key: ${{ secrets.PRIVATE_KEY }}
          app_id: ${{ secrets.APP_ID }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          configurationFile: .github/renovate-global.json
          token: '${{ steps.get_token.outputs.token }}'
          renovate-image: ghcr.io/cgrindel/renovate-bot
          renovate-version: latest
        env:
          LOG_LEVEL: debug
          # Gives do_renovate_post_upgrade in rules_swift_package_manager the
          # BuildBuddy key, so its Bazel invocations share cached actions
          # instead of rebuilding the Go toolchain in every modified workspace.
          #
          # customEnvVariables is what puts a value into a post-upgrade
          # command's environment. Renovate builds that environment from a fixed
          # list of variables that cannot be extended any other way. The name
          # must also start with RENOVATE_, because renovatebot/github-action
          # forwards only RENOVATE_*, LOG_LEVEL, GITHUB_COM_TOKEN, NODE_OPTIONS,
          # and the proxy vars into the container.
          #
          # RENOVATE_SECRETS makes Renovate redact the value in its own output.
          # This job runs at LOG_LEVEL debug, which dumps the resolved config,
          # and customEnvVariables is not in Renovate's redactedFields. Without
          # this, GitHub Actions masking is the only thing hiding the key.
          #
          # The {{ }} below is a Renovate secret template, not a GitHub
          # expression. It has no leading $ on purpose.
          #
          # Verified against renovatebot/github-action 957af03, Renovate 44.30.3.
          RENOVATE_SECRETS: '{"BUILDBUDDY_API_KEY":"${{ secrets.BUILDBUDDY_API_KEY }}"}'
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"BUILDBUDDY_API_KEY":"{{ secrets.BUILDBUDDY_API_KEY }}"}'
